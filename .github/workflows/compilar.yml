name: Compilar C++
on:
  push:
  pull_request:
jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: bash scripts/compilar.sh
      - name: Comprobar salida del menú
        run: |
          printf '0\n' | timeout 5s ./wattcontrol
          timeout 5s ./wattcontrol < /dev/null
